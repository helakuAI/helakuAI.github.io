<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Helaku AI Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0f0f17;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#frame{position:fixed;top:0;left:0;right:0;bottom:0;border:0;width:100%;height:100%}
#wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9ca3af;background:#0f0f17;z-index:5}
#wait .spin{width:36px;height:36px;border:3px solid #2b2b3a;border-top-color:#3b82f6;border-radius:50%;animation:r 1s linear infinite;margin-bottom:14px}
@keyframes r{to{transform:rotate(360deg)}}
#err{color:#f87171;margin-top:10px;font-size:13px;text-align:center;padding:0 20px}
</style>
</head>
<body>
<div id="wait"><div class="spin"></div><div>正在连接…</div><div id="err"></div></div>
<iframe id="frame" style="display:none" allow="autoplay; fullscreen; microphone; camera"></iframe>
<script>
var CURRENT='';
function poll(){
  fetch('./latest.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(j.url && j.url!==CURRENT){
      CURRENT=j.url;
      var f=document.getElementById('frame');
      f.src=j.url; f.style.display='block';
      document.getElementById('wait').style.display='none';
    }
  }).catch(function(e){
    document.getElementById('err').textContent='加载失败，将自动重试…';
  });
}
poll();
setInterval(poll, 60000);
</script>
</body>
</html>
