<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Helaku AI Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0f0f17}
#frame{position:fixed;top:0;left:0;right:0;bottom:0;border:0;width:100%;height:100%}
</style>
</head>
<body>
<iframe id="frame" allow="autoplay; fullscreen; microphone; camera"></iframe>
<script>
var tried = {};
var urls = [];
var curIdx = 0;

function loadUrls() {
  fetch('./latest.json?_='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json()})
    .then(function(j){
      if (j.urls && j.urls.length > 0) urls = j.urls;
      else if (j.url) urls = [j.url];
      jumpNext();
    })
    .catch(function(){
      setTimeout(loadUrls, 2000);
    });
}

function jumpNext() {
  if (curIdx >= urls.length) {
    curIdx = 0;
    tried = {};
    setTimeout(loadUrls, 2000);
    return;
  }
  var url = urls[curIdx];
  curIdx++;
  if (tried[url]) { jumpNext(); return; }
  tried[url] = true;
  document.getElementById('frame').src = url;
}

loadUrls();
</script>
</body>
</html>
